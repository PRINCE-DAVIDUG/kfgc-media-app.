<head>
  <meta charset="UTF-8" />

  <!-- Styles -->
  <link rel="stylesheet" href="general-styles.css" />

  <link rel="stylesheet" href="donate.css" />

<script src="theme.js" defer></script>

<body>

<!-- HEADER -->
<header class="header">
  <a href="javascript:history.back()" class="back-button">
    <i class="fas fa-arrow-left"></i> Back
  </a>
  <div class="logo">
    <img src="kfgc.jpg" alt="Kirinda Full Gospel Church Logo" />
  </div>
 
</header>

<!-- MAIN -->
<div class="container">

      <img src="grow.jpg" alt="Grow in faith and community" loading="lazy">
           
  <h1>Kirinda Full Gospel Church</h1>

  <form id="donationForm">

    <input type="text" id="fullname" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email" required>

    <input type="tel" id="phone" placeholder="Phone Number" required>

    <select id="donationType">
      <option>Tithe</option>
      <option>Offering</option>
      <option>Building Fund</option>
    </select>

    <input type="number" id="amount" placeholder="Amount" required>

    <textarea id="message" placeholder="Prayer Request"></textarea>

    <button type="submit">Donate Now</button>

  </form>

</div>
  <style>
  body {
  font-family: Arial;
  background: #f4f6f9;
}

.container {
  width: 90%;
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}

input,
select,
textarea,
button {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
}

button {
  background: #1f4068;
  color: white;
  border: none;
}
  </style>
  
  <script>
  const form = document.getElementById('donationForm');

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const donationData = {
    fullname: document.getElementById('fullname').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    donationType: document.getElementById('donationType').value,
    amount: document.getElementById('amount').value,
    message: document.getElementById('message').value
  };

  const response = await fetch('http://localhost:5000/api/donations/donate', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(donationData)
  });

  const result = await response.json();

  if(result.success) {
    window.location.href = result.payment_url;
  } else {
    alert('Payment initialization failed');
  }
});
  </script>
<script src="script.js"></script>
